<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>土地利用动态变化展示系统</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-content">
                <h1 class="title">土地利用动态变化展示系统</h1>
                <p class="subtitle">时空演变分析平台</p>
            </div>
        </header>

        <main class="main-container">
            <aside class="control-panel">
                <div class="panel-header">
                    <h3>控制面板</h3>
                </div>
                <div class="panel-content">
                    <section class="control-section">
                        <h4>地图工具</h4>
                        <button id="open-raster-map" 
                                style="width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
                            查看三期栅格地图
                        </button>
                    </section>

                    <section class="control-section">
                        <h4>区县信息</h4>
                        <div id="county-info" style="background: #f8f9fa; padding: 15px; border-radius: 6px; min-height: 80px; border: 1px solid #e0e0e0;">
                            <p id="county-placeholder" style="color: #999; font-style: italic; font-size: 0.85rem; margin: 0; text-align: center; line-height: 1.5;">
                                点击地图选择区县
                            </p>
                            <div id="county-details" style="display: none;">
                                <p style="margin-bottom: 8px; font-size: 0.85rem;">
                                    <span style="font-weight: 600; color: #2c3e50;">区县名称:</span>
                                    <span id="county-name" style="color: #3498db; font-weight: 500; margin-left: 5px;">-</span>
                                </p>
                                <p style="font-size: 0.85rem;">
                                    <span style="font-weight: 600; color: #2c3e50;">总面积:</span>
                                    <span id="landuse-total" style="color: #e74c3c; font-weight: bold; margin-left: 5px;">-</span>
                                    <span style="color: #666;">平方公里</span>
                                </p>
                            </div>
                        </div>
                    </section>

                    <section class="control-section">
                        <h4>时间维度</h4>
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #e0e0e0;">
                            <p style="margin: 0; font-size: 0.9rem; color: #2c3e50;">
                                <span style="font-weight: 600;">当前分析时间段</span>
                                <span id="current-period-display" style="color: #3498db; font-weight: bold; margin-left: 5px;">1980-2020</span>
                            </p>
                        </div>
                    </section>
                </div>
            </aside>

            <div class="main-content">
                <div class="map-area">
                    <div id="map" class="map"></div>
                </div>

                <div class="chart-area">
                    <div class="chart-container">
                        <div class="chart-item">
                            <h4>土地利用结构</h4>
                            <canvas id="landuse-chart"></canvas>
                        </div>
                        <div class="chart-item">
                            <h4>变化趋势分析</h4>
                            <canvas id="change-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
