<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>土地利用动态变化展示系统</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-content">
                <h1 class="title">土地利用动态变化展示系统</h1>
                <p class="subtitle">时空演变分析平台</p>
            </div>
        </header>

        <main class="main-container">
            <aside class="control-panel">
                <div class="panel-header">
                    <h3>控制面板</h3>
                </div>
                <div class="panel-content">
                    <section class="control-section">
                        <h4>地图工具</h4>
                        <button id="open-raster-map"
                                style="width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
                            查看三期栅格地图
                        </button>
                    </section>

                    <section class="control-section">
                        <h4>区县信息</h4>
                        <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; min-height: 80px; border: 1px solid #e0e0e0;">
                            <p id="county-placeholder" style="color: #999; font-style: italic; font-size: 0.85rem; margin: 0; text-align: center; line-height: 1.5;">
                                点击地图选择区县
                            </p>
                            <div id="county-details" style="display: none;">
                                <p style="margin-bottom: 8px; font-size: 0.85rem;">
                                    <span style="font-weight: 600; color: #2c3e50;">区县名称:</span>
                                    <span id="county-name" style="color: #3498db; font-weight: 500; margin-left: 5px;">-</span>
                                </p>
                                <p style="font-size: 0.85rem;">
                                    <span style="font-weight: 600; color: #2c3e50;">总面积:</span>
                                    <span id="landuse-total" style="color: #e74c3c; font-weight: bold; margin-left: 5px;">-</span>
                                    <span style="color: #666;">平方公里</span>
                                </p>
                            </div>
                        </div>
                    </section>

                    <section class="control-section">
                        <h4>时间维度</h4>
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #e0e0e0;">
                            <p style="margin: 0; font-size: 0.9rem; color: #2c3e50;">
                                <span style="font-weight: 600;">当前分析时间段</span>
                                <span id="current-period-display" style="color: #3498db; font-weight: bold; margin-left: 5px;">1980-2020</span>
                            </p>
                        </div>

                        <div style="margin-top: 15px;">
                            <h5 style="font-size: 0.85rem; margin-bottom: 8px; color: #2c3e50;">设置分析时间段</h5>
                            <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #e0e0e0;">
                                <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                                    <div style="flex: 1;">
                                        <label style="display: block; font-size: 0.8rem; color: #666; margin-bottom: 4px;">起始年份</label>
                                        <select id="start-year" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; background: white; cursor: pointer;">
                                            <option value="1980">1980</option>
                                            <option value="2000">2000</option>
                                        </select>
                                    </div>
                                    <div style="flex: 1;">
                                        <label style="display: block; font-size: 0.8rem; color: #666; margin-bottom: 4px;">结束年份</label>
                                        <select id="end-year" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; background: white; cursor: pointer;">
                                            <option value="2000">2000</option>
                                            <option value="2020" selected>2020</option>
                                        </select>
                                    </div>
                                </div>
                                <button id="update-period"
                                        style="width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;">
                                    更新分析时间段
                                </button>
                            </div>
                        </div>
                    </section>

                    <section class="control-section">
                        <h4>分析指标</h4>
                        <div style="position: relative;">
                            <select id="index-select" style="width: 100%; padding: 8px; padding-left: 35px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; background: white; cursor: pointer; appearance: auto;">
                                <option value="all">全部指标</option>
                                <option value="dynamic">土地利用动态度</option>
                                <option value="rate">土地利用变化率</option>
                                <option value="comprehensive">土地利用程度综合指数</option>
                                <option value="diversity">土地利用多样性指数</option>
                            </select>
                        </div>
                    </section>

                    <section class="control-section">
                        <h4 id="change-indices-title" style="display: flex; align-items: center;">
                            变化指数 (<span id="current-period">1980-2020</span>)
                        </h4>
                        <div id="indices-display" style="background: #f8f9fa; padding: 15px; border-radius: 6px; min-height: 100px; border: 1px solid #e0e0e0;">
                            <p style="color: #999; font-style: italic; font-size: 0.85rem; margin: 0; text-align: center;">
                                选择区县后显示变化指数
                            </p>
                        </div>
                    </section>

                    <section class="control-section">
                        <button id="toggle-matrix-btn"
                                style="width: 100%; padding: 12px; background: #9b59b6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">
                            显示转移矩阵
                        </button>
                        <p style="font-size: 0.75rem; color: #666; margin-top: 8px; text-align: center;">
                            选择区县后点击按钮查看转移矩阵
                        </p>
                    </section>

                    <section class="control-section" id="standalone-matrix-section" style="display: none; border-top: 2px solid #9b59b6; padding-top: 15px;">
                        <h4>土地利用转移矩阵</h4>
                        <div style="margin-top: 10px; max-height: 350px; overflow-y: auto; background: white; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px;">
                            <div id="standalone-matrix-container" style="min-height: 150px; display: flex; align-items: center; justify-content: center; color: #999; font-style: italic;">
                                加载中...
                            </div>
                        </div>
                    </section>
                </div>
            </aside>

            <div class="main-content">
                <div class="map-area">
                    <div id="map" class="map"></div>
                </div>

                <div class="chart-area">
                    <div class="chart-container">
                        <div class="chart-item">
                            <h4>土地利用结构</h4>
                            <canvas id="landuse-chart"></canvas>
                        </div>
                        <div class="chart-item">
                            <h4>变化趋势分析</h4>
                            <canvas id="change-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
